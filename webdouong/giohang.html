<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang chủ - Đồ uống mát lạnh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="dinhdang.css" rel="stylesheet">
</head>
<body>

  
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="https://youtu.be/YKv6kvqMD3Q">
        <img src="media/02ef7e3620489770f7a7d6623f7c6003.jpg" alt="Logo" class="logo-img">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="trangchu.html">Trang chủ</a></li>
            <li class="nav-item"><a class="nav-link" href="tra.html">Trà</a></li>
            <li class="nav-item"><a class="nav-link" href="douongcoga.html">Đồ uống có ga</a></li>
            <li class="nav-item"><a class="nav-link" href="dichvu.html">Dịch Vụ</a></li>
            <li class="nav-item"><a class="nav-link" href="giohang.html">Giỏ hàng</a></li>
          </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="text-center mb-4">Giỏ Hàng Của Bạn</h2>

    <table class="table table-bordered">
      <thead class="table-secondary">
        <tr>
          <th>Sản phẩm</th>
          <th>Số lượng</th>
          <th>Giá</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Trà xanh</td>
          <td>2</td>
          <td>50.000đ</td>
        </tr>
        <tr>
          <td>Cola</td>
          <td>1</td>
          <td>20.000đ</td>
        </tr>
        <tr>
          <td colspan="2" class="text-end fw-bold">Tổng cộng:</td>
          <td><strong>70.000đ</strong></td>
        </tr>
      </tbody>
    </table>

    <form>
      <h4 class="mt-4">Thông tin giao hàng</h4>

      <div class="mb-3">
        <label for="fullname" class="form-label">Họ và tên:</label>
        <input type="text" id="fullname" name="fullname" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Địa chỉ:</label>
        <input type="text" id="address" name="address" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phương thức thanh toán:</label><br>
        <input type="radio" id="cod" name="payment" value="cod" checked>
        <label for="cod">Thanh toán khi nhận hàng</label><br>

        <input type="radio" id="momo" name="payment" value="momo">
        <label for="momo">Ví MoMo</label><br>

        <input type="radio" id="bank" name="payment" value="bank">
        <label for="bank">Chuyển khoản ngân hàng</label>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="agree" required>
        <label class="form-check-label" for="agree">Tôi đồng ý với <a href="#">điều khoản sử dụng</a></label>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Xác nhận mật khẩu:</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success">Đặt hàng</button>
    </form>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
